plugins {
    id 'com.android.library'
}

android {
    namespace 'com.limelight'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 21
        buildConfigField 'boolean', 'ROOT_BUILD', 'false'
        buildConfigField 'String', 'APPLICATION_ID', '"com.glitch9.play"'
        externalNativeBuild {
            ndkBuild { arguments 'PRODUCT_FLAVOR=nonRoot' }
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs = ['../app/src/main/java', 'src/main/java']
            res.srcDirs = ['../app/src/main/res']
            assets.srcDirs = ['../app/src/main/assets']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
    externalNativeBuild { ndkBuild { path '../app/src/main/jni/Android.mk' } }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.5.9'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
}
